name: Actualizar servicios desde Google Sheets

on:
  schedule:
    # 10:17 UTC = 07:17 de Argentina.
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actualizar-servicios.yml'
      - 'scripts/sync-google-sheets.mjs'
      - 'scripts/verify-published.mjs'
      - 'scripts/sync-google-sheets.test.mjs'

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-catalogo-servicios
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar el repositorio completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          clean: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Comprobar conversión y conservación de datos
        run: node --test scripts/sync-google-sheets.test.mjs

      - name: Leer servicios y descuentos
        run: node scripts/sync-google-sheets.mjs

      - name: Guardar la actualización en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catálogo y registrar lectura de Google Sheets"
            git push origin HEAD:main
          fi

      # GITHUB_TOKEN pushes do not automatically rebuild branch-based Pages.
      # Request its build explicitly; retain the existing main / publishing source.
      - name: Publicar en GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'

      - name: Verificar los datos publicados
        run: node scripts/verify-published.mjs
