<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="Simulador geopolítico local sin límite temporal: gobierno, impuestos, demografía, comercio y construcción nacional." />
    <title>Pulso Global</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%2338d9c5' stroke-width='4'/%3E%3Cpath d='M11 32h42M32 11c8 8 8 34 0 42M32 11c-8 8-8 34 0 42' fill='none' stroke='%23f4b860' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./data.js" defer></script>
    <script src="./engine.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main id="app">
      <section class="start-screen" aria-labelledby="game-title">
        <header class="start-header">
          <div class="brand-mark" aria-hidden="true"><span></span></div>
          <div>
            <p class="eyebrow">Simulador de gobierno</p>
            <h1 id="game-title">Pulso Global</h1>
          </div>
          <button id="continue-button" class="button button-quiet" type="button" hidden>Continuar partida</button>
        </header>

        <div class="briefing">
          <div>
            <p class="briefing-label">01 · Elegí tu país</p>
            <h2>El poder empieza con una decisión.</h2>
          </div>
          <p>Administrá recursos, presupuesto, trabajo, subsidios y obras mientras el resto del mundo también evoluciona.</p>
        </div>

        <div id="country-grid" class="country-grid" aria-label="Países disponibles"></div>

        <section id="leader-panel" class="leader-panel" aria-live="polite">
          <div class="leader-placeholder">
            <span class="radar" aria-hidden="true"></span>
            <p>Seleccioná un país para conocer sus figuras disponibles.</p>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
